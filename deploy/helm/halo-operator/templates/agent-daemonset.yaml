{{- if .Values.agent.enabled }}
# The node observation agent. It reads two things from the host, both mounted
# read-only and both narrow: the kernel command line (a single file) and the
# sysfs tree the amdgpu counters live in. It runs with no privilege, no host
# network, no host PID namespace, and a cluster identity that can write
# nothing but HaloNodeObservations. This operator never mutates a host, and
# the agent's pod spec is where that is enforced, not just promised.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "halo-operator.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "halo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "halo-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        {{- include "halo-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "halo-operator.agentServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: agent
        image: {{ include "halo-operator.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /agent
        args:
        - --proc-root=/host/proc
        - --sys-root=/host/sys
        - --etc-root=/host/etc
        - --esp-root=/host/efi
        - --interval={{ .Values.agent.interval }}
        {{- with .Values.agent.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          {{- $sc := deepCopy .Values.securityContext }}
          {{- if .Values.agent.readBootEntries }}
          {{- /* Root by uid only: the entries are owned by root and mode 0700,
                 so owner permission is enough and no capability is added. */}}
          {{- $_ := set $sc "runAsUser" 0 }}
          {{- $_ := set $sc "runAsNonRoot" false }}
          {{- end }}
          {{- toYaml $sc | nindent 10 }}
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
        volumeMounts:
        # Only the one file the agent reads, not the host's whole /proc.
        - name: proc-cmdline
          mountPath: /host/proc/cmdline
          readOnly: true
        # The running kernel's release (what `uname -r` prints), again one
        # file rather than the host's /proc/sys.
        - name: proc-osrelease
          mountPath: /host/proc/sys/kernel/osrelease
          readOnly: true
        # /sys is mounted whole because the PCI device directories are a
        # symlink farm into /sys/devices; a narrower mount would dangle.
        - name: sys
          mountPath: /host/sys
          readOnly: true
        # Declared module options, read as the intent the running values are
        # compared against, so a value staged but not yet booted reads as
        # RebootPending (#31).
        - name: etc-modprobe
          mountPath: /host/etc/modprobe.d
          readOnly: true
        {{- if .Values.agent.readBootEntries }}
        # The boot hold's PERSISTED sources. Read-only, and the operator never
        # writes them: removing `splash` is Glimmer's signed-task path.
        - name: etc-kernel
          mountPath: /host/etc/kernel
          readOnly: true
        - name: esp
          mountPath: /host/efi
          readOnly: true
          # /efi is autofs: the ESP is mounted on first access, in the host's
          # mount namespace. HostToContainer lets that mount reach the agent;
          # without it the agent sees the empty autofs directory forever.
          mountPropagation: HostToContainer
        {{- end }}
      volumes:
      - name: proc-cmdline
        hostPath:
          path: /proc/cmdline
          type: File
      - name: proc-osrelease
        hostPath:
          path: /proc/sys/kernel/osrelease
          type: File
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: etc-modprobe
        hostPath:
          path: /etc/modprobe.d
          type: Directory
      {{- if .Values.agent.readBootEntries }}
      - name: etc-kernel
        hostPath:
          path: /etc/kernel
          type: Directory
      # /efi is an AUTOFS mount on a Strix Halo unit (systemd-1 ->
      # /dev/nvme0n1p1, vfat). A container can see this as an EMPTY directory
      # until the mount is triggered — no error and no permission denial.
      #
      # That is handled rather than prevented: the agent reports the listing
      # and its count separately, and the operator turns an empty listing into
      # BootHoldCleared=Unknown, never True. An empty ESP is not a cleared
      # unit.
      #
      # AND THE ENTRIES ARE MODE 0700, ROOT-ONLY, which is why these mounts
      # come only with agent.readBootEntries, which also runs the agent as
      # uid 0 (halo-operator#13). Both are type Directory, so a node without
      # them fails loudly rather than letting the runtime create the path.
      - name: esp
        hostPath:
          path: /efi
          type: Directory
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}
