{{- if and .Values.agent.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "halo-operator.agentServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "halo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.agent.enabled .Values.rbac.create }}
---
# What a read-only node observer is allowed to do in the cluster: publish
# observations, and read its own Node to own them. Deliberately absent: any
# write access to Nodes or anything else — the node agent can never mutate
# cluster state beyond observations. create/patch cannot be scoped to the
# agent's own node name, so RBAC alone would let a compromised node publish an
# observation under another node's name — NFD's workers carry exactly that
# trust model. agent-admission-policy.yaml closes it: it admits only the
# observation named after the node in the caller's bound token
# (agent.pinObservationNames, on by default).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "halo-operator.fullname" . }}-agent
  labels:
    {{- include "halo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
rules:
- apiGroups:
  - amd.halo.glimmer.ai
  resources:
  - halonodeobservations
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "halo-operator.fullname" . }}-agent
  labels:
    {{- include "halo-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "halo-operator.fullname" . }}-agent
subjects:
- kind: ServiceAccount
  name: {{ include "halo-operator.agentServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
