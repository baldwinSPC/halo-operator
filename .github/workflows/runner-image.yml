# Builds the CI job container this repository's workflows run inside.
#
# This workflow deliberately stays on GitHub-hosted runners. It is what
# PRODUCES the image the self-hosted runners need, so running it on them would
# be circular — a broken image could not be replaced by the infrastructure it
# broke.
name: Runner image

on:
  push:
    branches: [main]
    paths: ['images/runner/**', '.github/workflows/runner-image.yml']
  pull_request:
    paths: ['images/runner/**', '.github/workflows/runner-image.yml']
  # For rebuilding after an upstream base-image or toolchain change with no
  # commit of our own.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/baldwinspc/halo-operator-runner

jobs:
  build:
    # ubuntu-24.04-arm is GitHub's native aarch64 runner. The ARC scale set
    # this image is for is aarch64, and building natively avoids QEMU, which
    # is both slow and a source of failures that do not reproduce on real
    # hardware.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request builds the image but must not publish it. Only main
      # produces something the CI workflow will pull.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/runner
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The pinned tag to use in ci.yml
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice::CI should pin ${{ env.IMAGE }}:${{ github.sha }}"
