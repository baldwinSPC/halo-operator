name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # A self-hosted ARC scale set on the Spark cluster. It runs in Kubernetes
    # container-hook mode with ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER=true, so
    # naming a container is mandatory, not stylistic — a job without one is
    # rejected by the runner.
    runs-on: glimmer-arm64-halo-operator
    # Built by .github/workflows/runner-image.yml. It carries Go, helm, make
    # and gcc, none of which the stock actions-runner image has.
    #
    # Pinned to the commit that built it, and scripts/ci-runner-pin-check.sh
    # keeps it that way. A moving tag makes a green unnameable: ":latest"
    # passing today says nothing about what runs tomorrow, and when it breaks
    # there is no way to state which image was tested. A commit SHA is
    # preferred over a bare digest because it is the one immutable form that
    # can also be *named* — `git show a4ea6ba` explains what is in this image.
    #
    # To move it: merge a change under images/runner/, then take the tag the
    # build workflow prints as a ::notice:: and update this line.
    container: ghcr.io/baldwinspc/halo-operator-runner:a4ea6ba1a7c43b30815158d64bfa1f1cc663dd77
    env:
      # The job container runs as a uid that does not own the checkout, so git
      # refuses every operation in it with "detected dubious ownership" and
      # exit 128. That surfaces in the least obvious place available: `go build`
      # shells out to git to stamp VCS info, so the failure reads "error
      # obtaining VCS status: exit status 128" and names neither git nor
      # ownership.
      #
      # actions/checkout already sets a safe.directory exception and it does not
      # stick. It writes one with `git config --global`, into $HOME/.gitconfig,
      # and HOME does not survive to the steps that need it — so a later step
      # reads a file that is no longer there. Passing the exception through the
      # environment beats configuring it, because the environment is the one
      # thing every step inherits.
      #
      # Scoped to the workspace rather than "*": "*" switches git's ownership
      # check off wholesale, which is a different thing from making one
      # exception for the directory we put there ourselves.
      #
      # The exact HOME mechanism — reassigned to a temporary that is gone by the
      # next step, versus absent outright — is being measured by the diagnostic
      # step below; this comment will be narrowed to whichever it is. The fix
      # holds under both, which is precisely why the wrong explanation could sit
      # here indefinitely without anything going red.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-go: the runner image carries the toolchain, and
      # GOTOOLCHAIN=auto fetches an exact match when go.mod requires a newer
      # patch release than the baked one.
      # TEMPORARY. Settles whether HOME is reassigned or absent inside the
      # container hook's step execs, and whether github.workspace is the
      # in-container path. Delete once the env comment above is narrowed.
      - name: Diagnostic — HOME, workspace and cache derivation
        run: |
          echo "HOME=[${HOME:-<unset>}]"
          echo "github.workspace=[${{ github.workspace }}]"
          echo "GITHUB_WORKSPACE=[${GITHUB_WORKSPACE:-<unset>}]"
          echo "PWD=[$PWD]  uid=$(id -u)  owner_of_pwd=$(stat -c %u . 2>/dev/null)"
          echo "go env GOCACHE=[$(go env GOCACHE)]"
          echo "go env GOPATH=[$(go env GOPATH)]"
          echo "git global cfg file=[${HOME:-<unset>}/.gitconfig] exists=$([ -f "${HOME:-/nonexistent}/.gitconfig" ] && echo yes || echo no)"
          echo "safe.directory as git sees it:"; git config --get-all safe.directory || echo "  (none)"

      - name: The toolchain is present
        # The chart render tests skip when helm is missing, and a silent skip
        # is indistinguishable from a pass — so assert the tools before using
        # them rather than discovering a gap as a green build that tested
        # nothing. The runner image asserts the same set at build time; this is
        # the check that the job is actually running in that image.
        run: |
          go version
          helm version --short
          make --version | head -1

      - name: Forbid glimmer imports
        run: make verify-no-glimmer-imports

      - name: Job containers are immutably pinned
        run: make verify-runner-pin

      - name: Lint the Helm chart
        run: make helm-lint

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # make test resolves KUBEBUILDER_ASSETS, so the envtest suite runs for
        # real here. It skips when the assets are missing, and a silent skip is
        # indistinguishable from a pass.
        run: make test

      - name: The envtest suite actually ran
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1 use 1.36.2 --bin-dir "$(pwd)/bin" -p path)" \
            go test ./internal/controller/ -run TestCRDAcceptsTheSample -v | tee /tmp/envtest.log
          if grep -q "SKIP" /tmp/envtest.log; then
            echo "the envtest suite skipped; the control-plane assets are missing" >&2
            exit 1
          fi
      - name: Generated files are current
        run: |
          make generate manifests
          git diff --exit-code
