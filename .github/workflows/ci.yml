name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Forbid glimmer imports
        run: make verify-no-glimmer-imports
      - name: Helm is present
        # The chart render tests skip when helm is missing. A silent skip is
        # indistinguishable from a pass, so fail loudly instead.
        run: helm version

      - name: Lint the Helm chart
        run: make helm-lint

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Generated files are current
        run: |
          make generate manifests
          git diff --exit-code
