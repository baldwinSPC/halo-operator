name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # A self-hosted ARC scale set on the Spark cluster. It runs in Kubernetes
    # container-hook mode with ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER=true, so
    # naming a container is mandatory, not stylistic — a job without one is
    # rejected by the runner.
    runs-on: glimmer-arm64-halo-operator
    # Built by .github/workflows/runner-image.yml. It carries Go, helm, make
    # and gcc, none of which the stock actions-runner image has.
    #
    # TODO: pin to a digest or commit SHA. The build workflow prints the exact
    # tag to use as a ::notice:: on every push to main; :latest is here only
    # until the first image lands, because a tag that moves under CI is a
    # reproducibility hole this repository would not otherwise accept.
    container: ghcr.io/baldwinspc/halo-operator-runner:latest
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-go: the runner image carries the toolchain, and
      # GOTOOLCHAIN=auto fetches an exact match when go.mod requires a newer
      # patch release than the baked one.
      - name: The toolchain is present
        # The chart render tests skip when helm is missing, and a silent skip
        # is indistinguishable from a pass — so assert the tools before using
        # them rather than discovering a gap as a green build that tested
        # nothing. The runner image asserts the same set at build time; this is
        # the check that the job is actually running in that image.
        run: |
          go version
          helm version --short
          make --version | head -1

      - name: Forbid glimmer imports
        run: make verify-no-glimmer-imports

      - name: Lint the Helm chart
        run: make helm-lint

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # make test resolves KUBEBUILDER_ASSETS, so the envtest suite runs for
        # real here. It skips when the assets are missing, and a silent skip is
        # indistinguishable from a pass.
        run: make test

      - name: The envtest suite actually ran
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1 use 1.36.2 --bin-dir "$(pwd)/bin" -p path)" \
            go test ./internal/controller/ -run TestCRDAcceptsTheSample -v | tee /tmp/envtest.log
          if grep -q "SKIP" /tmp/envtest.log; then
            echo "the envtest suite skipped; the control-plane assets are missing" >&2
            exit 1
          fi
      - name: Generated files are current
        run: |
          make generate manifests
          git diff --exit-code
