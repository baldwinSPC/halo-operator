# A typical Strix Halo cluster config. Every stanza is optional; enabled
# components default to on, and every node must be able to run both backends.
apiVersion: amd.halo.glimmer.ai/v1alpha1
kind: HaloDeviceConfig
metadata:
  name: default
spec:
  memoryPolicy:
    # GTT is sized by ttm.pages_limit (pages, here 124 GiB on 4 KiB pages).
    # amdgpu.gttsize is deprecated by the kernel; don't declare it.
    expectedKernelArgs:
      amd_iommu: "off"
      ttm.pages_limit: "32505856"
    minEffectiveGPUMemoryGiB: 100
  runtimeProfile:
    # The backends every node must be able to run. Which one a workload uses
    # is the workload's choice; the node only has to expose what each needs.
    backends: [vulkan, rocm]
